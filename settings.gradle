pluginManagement {
    repositories {
        if (getProperty("useLocalRepo")) {
            mavenLocal()
        }

        maven {
            credentials.username mavenUser
            credentials.password mavenPassword
            url repo
        }

        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    versionCatalogs {
        create("corpus") {
            from(files("./gradle/corpus.versions.toml"))
        }
    }
}

rootProject.name = 'javaDSL'

include(':javaDSL')
include(':javaDSL-emf')
include(':ref-code-adaptation')