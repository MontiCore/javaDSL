description = "MontiCore: Java DSL"

def grammarsDir = "src/main/grammars"

configurations {
    corpus {
        canBeConsumed = false
        canBeResolved = true

        transitive = false

        resolutionStrategy.dependencySubstitution.all {
            artifactSelection {
                selectArtifact("jar", "jar", "sources")
            }
        }
    }
}

sourceSets {
    main.java.srcDir("$buildDir/generated-sources/monticore/sourcecode")

    grammars {
        resources {
            srcDir(grammarsDir)
            include "**/*.mc4"
        }
    }
}

java {
    registerFeature("grammars") {
        usingSourceSet(sourceSets.grammars)
    }
}

tasks.register("generateTextBlock", MCTask) {
    grammar = file "$projectDir/$grammarsDir/de/monticore/java/TextBlock.mc4"
    outputDir = file "$buildDir/generated-sources/monticore/sourcecode"
    handcodedPath "$projectDir/src/main/java"

    def upToDate = incCheck("de/monticore/java/TextBlock.mc4")
    outputs.upToDateWhen { upToDate }
}

tasks.register("generate", MCTask) {
    dependsOn(tasks.generateTextBlock)

    grammar = file "$projectDir/$grammarsDir/de/monticore/java/JavaDSL.mc4"
    outputDir = file "$buildDir/generated-sources/monticore/sourcecode"
    modelPath "$projectDir/$grammarsDir"
    handcodedPath "$projectDir/src/main/java"

    def upToDate = incCheck("de/monticore/java/JavaDSL.mc4")
    outputs.upToDateWhen { upToDate }
    dependsOn(generateTextBlock)  // should not be necessary -> otherwise, TextBlock was skipped
}

tasks.register('extractCorpus') {
    dependsOn(configurations.corpus)

    def destinationDir = layout.buildDirectory.dir("corpus")

    inputs.files(provider { configurations.corpus })
    outputs.dir(destinationDir)
    outputs.cacheIf { true }

    doLast {
        copy {
            into(destinationDir)

            includeEmptyDirs = false
            include("**/*java")

            configurations.corpus.each { file ->
                into(file.name.substring(0, file.name.lastIndexOf("."))) {
                    from(zipTree(file))
                }
            }
        }
    }
}

tasks.withType(Test).configureEach {
    dependsOn(extractCorpus)
}

dependencies {
    implementation(platform(libs.junit.bom))

    api(libs.monticore.grammar)
    api(libs.monticore.runtime)

    grammar(libs.monticore.grammar) {
        capabilities {
            requireCapability("de.monticore:monticore-grammar-grammars")
        }
    }

    testImplementation(libs.junit.jupiter.api)
    testImplementation(libs.junit.jupiter.params)
    testRuntimeOnly(libs.junit.jupiter.engine)

    corpus(corpus.guava)
    corpus(corpus.monticore.runtime)
    // TODO: fix parser for Java 17 and enable
    //corpus(corpus.quitte)
}