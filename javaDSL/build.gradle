import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

apply plugin:"com.github.johnrengelman.shadow"

description = "MontiCore: Java DSL"

def grammarsDir = "src/main/grammars"

configurations {
    corpus {
        canBeConsumed = false
        canBeResolved = true

        transitive = false

        resolutionStrategy.dependencySubstitution.all {
            artifactSelection {
                selectArtifact("jar", "jar", "sources")
            }
        }
    }
}


tasks.register('extractCorpus') {
    dependsOn(configurations.corpus)

    def destinationDir = layout.buildDirectory.dir("corpus")

    inputs.files(provider { configurations.corpus })
    outputs.dir(destinationDir)
    outputs.cacheIf { true }

    doLast {
        copy {
            into(destinationDir)

            includeEmptyDirs = false
            include("**/*java")

            configurations.corpus.each { file ->
                into(file.name.substring(0, file.name.lastIndexOf("."))) {
                    from(zipTree(file))
                }
            }
        }
    }
}

tasks.withType(Test).configureEach {
    dependsOn(extractCorpus)
}

tasks.register('buildJavaDSLTool', ShadowJar) {
    minimize()
    group = 'mc'
    archiveFileName = 'MCJavaDSL.jar'
    archiveClassifier = 'javadsl-mc-tool'
    manifest {
        attributes('Main-Class':'de.monticore.java.JavaDSLTool')
    }
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
}
jar.dependsOn(buildJavaDSLTool)

dependencies {
    implementation "de.monticore.lang:cd4analysis:$mc_version"
    implementation "de.monticore:class2mc:$mc_version"

    grammar "de.monticore:monticore-grammar:$mc_version"

    testImplementation testFixtures("de.monticore:monticore-grammar:$mc_version")
    testImplementation "org.junit.jupiter:junit-jupiter-api:$junit_version"
    testImplementation "org.junit.jupiter:junit-jupiter-params:$junit_version"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:$junit_version"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junit_version"

    corpus(corpusLibs.guava)
    corpus(corpusLibs.monticore.runtime)
    // TODO: fix parser for Java 17 and enable
    //corpus(corpusLibs.quitte)
}